<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF2D48" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#FF6B7D" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B1C33" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E1528" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#EF2D48" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3A0D1B" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  {/* Back Wave */}
  <path
    d="M 0 35 C 70 15, 140 50, 210 25 C 260 8, 290 18, 320 30 L 320 80 L 0 80 Z"
    fill="url(#waveGrad1)"
  />

  {/* Front Wave */}
  <path
    d="M 0 45 C 80 60, 160 25, 240 40 C 280 48, 305 42, 320 38 L 320 80 L 0 80 Z"
    fill="url(#waveGrad2)"
  />
</svg>
