<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="topSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#1A0D1E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="cloudGlowLeft" cx="30%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#FF6B7D" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#EF2D48" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#5A1526" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cloudGlowRight" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FF6B7D" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#EF2D48" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6B182B" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="256" height="140" fill="url(#topSkyGrad)" />

  <!-- Stars -->
  <circle cx="24" cy="18" r="0.8" fill="#FFFFFF" opacity="0.4" />
  <circle cx="68" cy="14" r="0.6" fill="#FFFFFF" opacity="0.5" />
  <circle cx="112" cy="24" r="1" fill="#FFFFFF" opacity="0.6" />
  <circle cx="165" cy="16" r="0.7" fill="#FFFFFF" opacity="0.4" />
  <circle cx="232" cy="34" r="0.9" fill="#FFFFFF" opacity="0.5" />
  <circle cx="36" cy="52" r="0.7" fill="#FFFFFF" opacity="0.3" />

  <!-- Left Clouds -->
  <g opacity="0.85">
    <path d="M 0 88 C 12 76, 36 74, 46 82 C 54 68, 76 68, 84 80 C 94 77, 106 83, 108 93 C 110 102, 100 112, 88 114 L 0 114 Z" fill="#4A1424" opacity="0.65" />
    <path d="M 4 92 C 16 82, 34 80, 42 86 C 50 76, 67 75, 75 85 C 84 83, 93 88, 94 96 C 96 104, 88 110, 78 112 L 4 112 Z" fill="url(#cloudGlowLeft)" />
  </g>

  <!-- Right Clouds -->
  <g opacity="0.9">
    <path d="M 152 108 C 162 96, 178 94, 187 100 C 195 86, 218 84, 228 94 C 238 91, 250 98, 256 105 L 256 128 L 144 128 C 144 118, 147 110, 152 108 Z" fill="#581628" opacity="0.65" />
    <path d="M 158 110 C 166 101, 180 99, 188 104 C 194 92, 214 90, 222 99 C 232 96, 243 101, 250 109 L 250 124 L 150 124 C 150 117, 153 112, 158 110 Z" fill="url(#cloudGlowRight)" />
  </g>

  <!-- Looping Flight Trail -->
  <path
    d="M 92 100 C 108 86, 124 105, 140 89 C 150 78, 145 65, 134 68 C 123 71, 124 84, 137 82 C 155 79, 177 66, 196 50"
    stroke="url(#trailGrad)"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <path
    d="M 100 98 C 114 86, 126 102, 139 88 C 147 78, 144 68, 136 70 C 128 72, 128 81, 139 81 C 156 78, 177 65, 194 51"
    stroke="#FFFFFF"
    stroke-opacity="0.2"
    stroke-width="0.75"
    stroke-dasharray="2 3"
  />

  <!-- White Commercial Airplane Jet Climbing to Upper Right -->
  <g transform="translate(196, 46) rotate(-28) scale(0.9)">
    <!-- Engine Glow -->
    <ellipse cx="10" cy="8" rx="14" ry="5" fill="#EF2D48" opacity="0.35" />

    <!-- Wings -->
    <path d="M 12 7 L 3 19 L 7 20 L 16 9 Z" fill="#F1F5F9" />
    <path d="M 13 5 L 5 -5 L 9 -5 L 17 3 Z" fill="#CBD5E1" />

    <!-- Fuselage -->
    <path d="M 0 6 C 2 4, 7 3.5, 14 4.5 C 21 5.5, 25 6.5, 27 7 C 25 7.5, 21 8.5, 14 9.5 C 7 10.5, 2 9.5, 0 7 Z" fill="#FFFFFF" />

    <!-- Cockpit Window -->
    <path d="M 24 6.7 L 21 6.3 L 21 7.1 Z" fill="#1E293B" opacity="0.85" />

    <!-- Tail Fin -->
    <path d="M 2 6.5 L -3 -2 L 1 -2 L 5 6 Z" fill="#FFFFFF" />
    <path d="M 3 6.5 L 0 11 L 2 11 L 4 7 Z" fill="#E2E8F0" />

    <!-- Engines -->
    <rect x="9" y="11" width="4.5" height="2" rx="1" fill="#E2E8F0" />
    <rect x="10" y="-1" width="4.5" height="1.8" rx="0.9" fill="#94A3B8" />
  </g>
</svg>
