<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="skylineSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" stop-opacity="0" />
      <stop offset="35%" stop-color="#3A0D1B" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#6E1528" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#A52037" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="landmarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7588" />
      <stop offset="45%" stop-color="#EF2D48" />
      <stop offset="100%" stop-color="#7A1527" />
    </linearGradient>

    <linearGradient id="hillsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E1220" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="fadeToBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" stop-opacity="0" />
      <stop offset="70%" stop-color="#0B1120" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0.98" />
    </linearGradient>
  </defs>

  <!-- Sky Background Gradient -->
  <rect width="256" height="160" fill="url(#skylineSkyGrad)" />

  <!-- Distant Hills / Horizon Glow -->
  <path d="M 0 108 Q 64 96, 128 104 T 256 100 L 256 160 L 0 160 Z" fill="url(#hillsGrad)" opacity="0.65" />

  <!-- Berlin Landmarks Group -->
  <g fill="url(#landmarkGrad)">
    <!-- Far Left Buildings -->
    <rect x="0" y="112" width="16" height="48" />
    <rect x="18" y="106" width="12" height="54" />
    <polygon points="24,98 18,106 30,106" />
    <rect x="32" y="114" width="14" height="46" />

    <!-- Berlin Cathedral Dome -->
    <path d="M 50 120 L 50 112 C 50 104, 66 104, 66 112 L 66 120 Z" />
    <rect x="56.5" y="99" width="3" height="5" />
    <polygon points="58,95 56.5,99 59.5,99" />
    <rect x="47" y="118" width="22" height="42" />

    <!-- Centerpiece: Brandenburg Gate (Brandenburger Tor) -->
    <rect x="76" y="132" width="90" height="28" rx="1" />
    <rect x="73" y="130" width="96" height="3" rx="0.5" />

    <!-- Doric Columns (6 Pillars) -->
    <rect x="77" y="94" width="5" height="36" rx="0.5" />
    <rect x="87" y="94" width="5" height="36" rx="0.5" />
    <rect x="97" y="94" width="5" height="36" rx="0.5" />
    <rect x="110" y="94" width="5" height="36" rx="0.5" />
    <rect x="120" y="94" width="5" height="36" rx="0.5" />
    <rect x="130" y="94" width="5" height="36" rx="0.5" />
    <rect x="140" y="94" width="5" height="36" rx="0.5" />
    <rect x="150" y="94" width="5" height="36" rx="0.5" />
    <rect x="160" y="94" width="5" height="36" rx="0.5" />

    <!-- Architrave & Entablature -->
    <rect x="74" y="87" width="94" height="7" rx="0.8" />
    <rect x="79" y="81" width="84" height="6" rx="0.8" />

    <!-- Quadriga on Top -->
    <rect x="113" y="77" width="16" height="4" rx="0.5" />
    <path d="M 120 68 L 122 77 L 118 77 Z" />
    <circle cx="120" cy="66" r="1.6" />
    <path d="M 120 68 L 124 64 L 122 70 Z" />
    <path d="M 115 72 C 113 70, 111 72, 109 77 L 116 77 Z" />
    <path d="M 125 72 C 127 70, 129 72, 131 77 L 124 77 Z" />

    <!-- TV Tower (Fernsehturm Berlin) -->
    <polygon points="198,160 199,80 203,80 204,160" />
    <circle cx="201" cy="68" r="9.5" />
    <ellipse cx="201" cy="68" rx="12" ry="3" opacity="0.6" />
    <rect x="199.5" y="54" width="3" height="5" />
    <polygon points="200,54 202,54 201.5,8 200.5,8" />
    <circle cx="201" cy="7" r="1.3" fill="#FFFFFF" />

    <!-- Far Right Buildings -->
    <rect x="214" y="110" width="14" height="50" />
    <rect x="232" y="102" width="18" height="58" />
  </g>

  <!-- Foreground Wave Base -->
  <path d="M 0 138 Q 72 126, 136 135 T 256 132 L 256 160 L 0 160 Z" fill="#0B1120" opacity="0.9" />
  <rect y="142" width="256" height="18" fill="url(#fadeToBottom)" />
</svg>
